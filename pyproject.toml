[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms365sync_exapp"
version = "1.0.3"
description = "Microsoft 365 → Nextcloud sync, packaged as a Nextcloud ExApp (AppAPI)."
requires-python = ">=3.11"
dependencies = [
    "nc_py_api[app]>=0.18",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[tool.setuptools.packages.find]
include = ["ms365sync_exapp*"]
