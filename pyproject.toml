[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms365sync_exapp"
version = "1.0.18"
description = "Microsoft 365 → Nextcloud sync, packaged as a Nextcloud ExApp (AppAPI)."
requires-python = ">=3.14"
dependencies = [
    # nc_py_api: pinned to a tested-against minor range. The set_handlers /
    # appconfig_ex / ui.resources surfaces have shifted between minors, so
    # widening this is risky without re-verifying the enable flow.
    # >=0.21 is required for HaRP support: when HP_SHARED_KEY is set,
    # run_app() binds uvicorn to HP_EXAPP_SOCK (Unix socket) instead of
    # APP_HOST:APP_PORT, which is what HaRP's HAProxy connects to.
    "nc_py_api[app]>=0.21,<0.31",
    "fastapi>=0.110,<0.116",
    "uvicorn>=0.27,<0.32",
    "httpx>=0.27,<0.29",
    "pydantic>=2.5,<3",
]

[tool.setuptools.packages.find]
include = ["ms365sync_exapp*"]
