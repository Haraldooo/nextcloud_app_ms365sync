# Standalone docker-compose for testing.
# Joins the existing "internal" network from your main NC compose
# so the NC container can reach the worker at http://nc_ms365sync_worker:8080.

services:
  ms365sync-worker:
    build: .
    container_name: nc_ms365sync_worker
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ms365sync_logs:/logs
    environment:
      - LOG_LEVEL=INFO
    networks:
      - nc_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ms365sync_logs:

networks:
  nc_internal:
    external: true
    name: internal
