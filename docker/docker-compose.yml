version: '3.8'

services:
  ms365sync-worker:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - sync-logs:/logs
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sync-logs:
